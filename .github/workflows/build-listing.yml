name: Build and Deploy VPM Repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - source.json
      - Website/**
      - .github/workflows/build-listing.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  listPublishDirectory: _site
  pathToCi: ci
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUKE_TELEMETRY_OPTOUT: '1'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out listing
        uses: actions/checkout@v7

      - name: Check out listing builder
        uses: actions/checkout@v7
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ${{ env.pathToCi }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('ci/**/*.csproj') }}

      # Local mode rebuilds every release. The builder's server mode skips
      # existing URLs without copying their manifests into the new index.
      - name: Build package listing and website
        run: >-
          dotnet run
          --project "${{ env.pathToCi }}/PackageBuilder/PackageBuilder.csproj"
          --framework net8.0
          -- BuildRepoListing
          --root "$GITHUB_WORKSPACE/${{ env.pathToCi }}"
          --host terminal
          --package-listing-source-folder "$GITHUB_WORKSPACE"
          --list-publish-directory "$GITHUB_WORKSPACE/${{ env.listPublishDirectory }}"

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.listPublishDirectory }} --project-name=vpm-sjcl-me --branch=main
